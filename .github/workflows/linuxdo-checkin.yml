name: LinuxDO 活跃任务

on:
  workflow_dispatch:
    inputs:
      notification_test:
        description: 仅验证成功推送，不访问 LinuxDO
        required: false
        default: false
        type: boolean
      auth_test_only:
        description: 仅验证 Cookie 登录，不执行浏览任务
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: linuxdo-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-22.04
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      BROWSE_ENABLED: "true"
      LINUXDO_COOKIES: ${{ secrets.LINUXDO_COOKIES }}
    steps:
      - name: 校验 LinuxDO Cookie 配置
        if: inputs.notification_test != true
        run: |
          if [ -z "$LINUXDO_COOKIES" ]; then
            echo "GitHub production Environment Secret LINUXDO_COOKIES 未配置。" >&2
            exit 1
          fi

      - name: 检出代理辅助脚本
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 检出固定版本的 LinuxDO 签到实现
        if: inputs.notification_test != true
        uses: actions/checkout@v6
        with:
          repository: doveppp/linuxdo-checkin
          ref: 2b72a108950b45fa75ffd18517dda6da4e8fd57b
          path: linuxdo-checkin
          persist-credentials: false

      - name: 安装 Chrome
        if: inputs.notification_test != true
        uses: browser-actions/setup-chrome@v1

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        if: inputs.notification_test != true
        working-directory: linuxdo-checkin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 配置可选代理
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          # 此订阅节点名唯一匹配；避免按 Google 延迟自动切到 LinuxDO 不接受的出口。
          PROXY_NODE_FILTER: '^香港原生IP-1[|]勿跑大流量$'
          PROXY_TEST_URL: https://linux.do
          MIHOMO_VERSION: v1.19.27
          PROXY_REQUIRED: true
          PROXY_HEALTH_ATTEMPTS: 5
        run: bash scripts/setup_mihomo_proxy.sh

      - name: 将代理接入 LinuxDO 浏览器
        if: inputs.notification_test != true
        run: python scripts/patch_linuxdo_runtime.py linuxdo-checkin/main.py

      - name: 执行 LinuxDO 活跃任务
        if: inputs.notification_test != true
        working-directory: linuxdo-checkin
        env:
          LINUXDO_AUTH_TEST_ONLY: ${{ inputs.auth_test_only }}
        run: |
          marker="$RUNNER_TEMP/linuxdo-success"
          rm -f "$marker"
          LINUXDO_SUCCESS_MARKER="$marker" python main.py
          test -f "$marker"

      - name: 推送 LinuxDO 成功通知
        if: success() && inputs.notification_test != true
        env:
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        run: |
          python scripts/notify_linuxdo.py \
            --title "${{ inputs.auth_test_only == true && 'LinuxDO Cookie 验证成功' || 'LinuxDO 活跃任务成功' }}" \
            --content "${{ inputs.auth_test_only == true && 'Cookie 登录验证通过。' || '浏览任务完成。' }}运行记录：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 推送 LinuxDO 失败通知
        if: failure() && inputs.notification_test != true
        continue-on-error: true
        env:
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        run: |
          python scripts/notify_linuxdo.py \
            --title "LinuxDO 活跃任务失败告警" \
            --content "任务未完成。运行记录：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 验证 LinuxDO 推送通道
        if: success() && inputs.notification_test == true
        env:
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        run: |
          python scripts/notify_linuxdo.py \
            --title "LinuxDO 推送通道验证" \
            --content "推送通道可用。运行记录：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 停止代理
        if: always()
        run: bash scripts/stop_mihomo_proxy.sh
