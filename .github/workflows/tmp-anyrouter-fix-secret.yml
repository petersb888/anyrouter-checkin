name: TMP AnyRouter fix secret

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 生成修正后的账号配置
      env:
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
      run: python _tmp_fix_secret.py

    - uses: actions/upload-artifact@v4
      with:
        name: secret-payload
        path: fixed_accounts.json
        retention-days: 1
